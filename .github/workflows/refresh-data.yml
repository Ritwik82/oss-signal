name: Refresh project data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/refresh-data.mjs
        env:
          # PAT stored as a repo secret named GH_TOKEN (can't use GITHUB_ prefix).
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git diff --staged --quiet || git commit -m "Refresh project data [skip ci]" && git push
